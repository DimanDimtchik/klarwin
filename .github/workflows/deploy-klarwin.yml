name: Deploy KlarWin

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: |
          dotnet publish src/KlarWin/KlarWin.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/KlarWin
          Copy-Item deploy/dg.ganz-soft.de/klarwin/Installieren.bat dist/KlarWin/Installieren.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item deploy/dg.ganz-soft.de/klarwin/version.json out/
          Copy-Item deploy/dg.ganz-soft.de/klarwin/index.html out/
          Copy-Item docs/KlarWin-Handbuch.pdf out/
          Copy-Item docs/KlarWin-Handbuch.html out/
          Compress-Archive -Path dist/KlarWin/KlarWin.exe,dist/KlarWin/Installieren.bat -DestinationPath out/KlarWin-Setup.zip -Force
          Get-ChildItem out | Format-Table Name, Length

      - name: Setup SSH
        shell: bash
        env:
          KEY: ${{ secrets.DG_ALLINKL_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.DG_ALLINKL_SSH_USER }}
          SSH_HOST: ${{ secrets.DG_ALLINKL_SSH_HOST }}
        run: |
          test -n "$KEY"
          test -n "$SSH_USER"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host allinkl
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes -o ConnectTimeout=25 allinkl 'echo SSH_OK; hostname; pwd'

      - name: Upload
        shell: bash
        run: |
          REMOTE=www/htdocs/w0217246
          ssh allinkl "mkdir -p $REMOTE/dg.ganz-soft.de/klarwin $REMOTE/ganz-soft.de/klarwin"
          scp out/KlarWin-Setup.zip out/version.json out/index.html out/KlarWin-Handbuch.pdf out/KlarWin-Handbuch.html \
            allinkl:$REMOTE/dg.ganz-soft.de/klarwin/
          scp out/version.json allinkl:$REMOTE/ganz-soft.de/klarwin/version.json
          echo "OK https://dg.ganz-soft.de/klarwin/"
